name: Build Cross-Platform

on:
  push:
    tags:
      - 'v*'        # Trigger saat push tag: v1.0.0, v1.1.0, dst
  workflow_dispatch:  # Tombol manual di GitHub

permissions:
  contents: write    # Izin upload ke Releases

jobs:
  # ═══════════════════════════════════════════════════════════
  #  LINUX — AppImage
  # ═══════════════════════════════════════════════════════════
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build AppImage
        run: |
          chmod +x build_appimage.sh
          bash build_appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: dodol-agent.AppImage

  # ═══════════════════════════════════════════════════════════
  #  WINDOWS — .exe
  # ═══════════════════════════════════════════════════════════
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .exe
        run: python build_windows.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: dist/dodol-agent.exe

  # ═══════════════════════════════════════════════════════════
  #  macOS — .app
  # ═══════════════════════════════════════════════════════════
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: dist/Dodol Agent.app

  # ═══════════════════════════════════════════════════════════
  #  RELEASE — Upload semua binary ke GitHub Releases
  # ═══════════════════════════════════════════════════════════
  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List files
        run: find artifacts -type f | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/linux-appimage/*
            artifacts/windows-exe/*
            artifacts/macos-app/*
